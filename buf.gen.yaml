# ============================================
# Buf v2 — Protobuf code generation config
# ============================================
# Uses single @bufbuild/protoc-gen-es plugin with services=true
# Generates plain TypeScript types + Connect service clients
#
# Prerequisites:
#   - buf CLI v1.40+: https://buf.build/docs/installation
#   - protoc-gen-es: npm install -D @bufbuild/protoc-gen-es
#
# Usage:
#   npm run proto:generate  (runs buf generate)
#
# Output: src/shared/api/gen/
#   - messenger_pb.ts       (plain types: Chat, Message, etc.)
#   - messenger_connect.ts  (Connect service clients)
#
# Note: In Connect v2, messages are plain types (not classes).
# Use create() from @bufbuild/protobuf to instantiate:
#   import { create } from "@bufbuild/protobuf"
#   import { MessageSchema } from "./gen/messenger_pb.js"
#   const msg = create(MessageSchema, { text: "Привет" })
# ============================================

version: v2
plugins:
  # Single plugin generates both types AND Connect services
  - local: protoc-gen-es
    out: src/shared/api/gen
    opt:
      - target=ts
      - services=true
