# ============================================
# Buf v2 — Protobuf code generation config
# ============================================

version: v2
plugins:
  # Generate TypeScript messages/enums
  - local: protoc-gen-es
    out: src/shared/api/gen
    opt:
      - target=ts

  # Generate Connect service clients
  - local: protoc-gen-connect-es
    out: src/shared/api/gen
    opt:
      - target=ts
